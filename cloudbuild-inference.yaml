# Cloud Build — inference image ONLY (used by the GitHub push trigger)
#
# Triggered automatically on push to main when these paths change:
#   src/**  api/**  Dockerfile.cloudrun  cloudbuild-inference.yaml
#
# Machine: default (n1-highcpu-1) — qualifies for 120 free build-min/day.
# After the first build, Docker layer cache means model-download steps are
# skipped entirely; only changed src/api layers rebuild (~5-10 min total).
#
# Deploy: Cloud Run, us-central1, NVIDIA L4 GPU, min-instances=0.

substitutions:
  _REGION: us-central1
  _SERVICE: mgvaovao-inference
  # Plateforme de collecte, d'ou la demonstration tire la liste des dialectes.
  #
  # L'URL Cloud Run plutot que https://kozy.mg : c'est un appel de service a
  # service, que l'utilisateur ne voit jamais. Le faire passer par le domaine
  # public le rendrait dependant du DNS et de la validite du certificat, pour
  # aucun benefice.
  _COLLECTION_URL: https://kozy-97374817504.us-central1.run.app
  # Etiquette de l'image. SHORT_SHA n'est renseigne QUE par un declencheur :
  # une soumission manuelle le laisse vide et le build echoue sur un nom
  # d'image invalide. Passer _TAG explicitement rend les deux voies possibles.
  _TAG: manual
  # Job d'affinage des declinaisons.
  _FINETUNE_JOB: "kozy-finetune"
  # Corpus minimal sous lequel l'affinage degrade le modele de base.
  _FINETUNE_MIN_LIGNES: "200"
  # Garde-fous d'usage de la demonstration — voir api/quotas.py.
  #
  # Le service tourne sur un GPU facture a la seconde d'instance, et Cloud Run
  # laisse une session WebSocket ouverte jusqu'a une heure : sans ces limites,
  # quelques connexions maintenues ouvertes font tourner deux GPU en continu.
  #
  # Les valeurs sont ici, et non dans le code, pour qu'une demonstration devant
  # des partenaires puisse etre elargie le temps d'une journee sans
  # reconstruire l'image.
  _QUOTA_SESSIONS_PAR_IP: "2"
  _QUOTA_RAFALE: "10"
  _QUOTA_RAFALE_FENETRE_S: "60"
  # Dix minutes par session. La borne haute reste le --timeout de Cloud Run
  # ci-dessous : porter cette valeur au-dela n'aurait aucun effet.
  _QUOTA_DUREE_SESSION_S: "600"
  _QUOTA_SILENCE_S: "120"
  # Trente minutes d'essai par adresse et par jour ; huit heures de session
  # cumulees pour l'ensemble, ce qui borne la facture quotidienne du GPU.
  _QUOTA_BUDGET_IP_S: "1800"
  _QUOTA_BUDGET_GLOBAL_S: "28800"
  _QUOTA_REST: "30"
  _QUOTA_REST_FENETRE_S: "60"

steps:

  # ── 1. Build inference image (cache-from pulls cached layers from AR) ───────
  - id: build-inference
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.cloudrun
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:${_TAG}
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:latest
      - --cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:latest
      - .
    timeout: 3000s

  # ── 2. Push ──────────────────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, "us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:${_TAG}"]
    waitFor: [build-inference]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, "us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:latest"]
    waitFor: [build-inference]

  # ── 3. Deploy to Cloud Run ───────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [push-sha]
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:${_TAG}
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --platform=managed
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --cpu=8
      - --memory=32Gi
      - --no-cpu-throttling
      - --no-gpu-zonal-redundancy
      # Une connexion WebSocket occupe sa place tant qu'elle dure. Avec
      # --concurrency=1, un seul auditeur monopolisait l'instance entiere :
      # sa propre reconnexion, ou le simple chargement de /dialects/, partait
      # sur une seconde instance qui demarrait a froid pendant 45 secondes, et
      # la connexion arrivait avant les modeles. C'est ce qui produisait les
      # coupures repetees en pleine phrase.
      #
      # Le GPU serialise de toute facon les inferences ; ce reglage ne sert
      # qu'a laisser plusieurs sessions et les requetes statiques partager une
      # instance deja chaude.
      - --concurrency=4
      - --min-instances=0
      - --max-instances=2
      # Cloud Run compte une session WebSocket comme UNE requete : a 300 s,
      # toute session etait coupee au bout de cinq minutes, meme active.
      - --timeout=3600
      - --port=8080
      # --set-env-vars remplace TOUTE la configuration : chaque variable
      # necessaire doit figurer ici, sinon elle disparait au deploiement.
      # Une seule ligne, volontairement : un scalaire plie sur plusieurs
      # lignes en YAML les rejoint par des espaces, et chaque nom de
      # variable apres une virgule partirait avec un espace en tete.
      - --set-env-vars=MGVAOVAO_DEVICE=cuda,MGVAOVAO_WHISPER_MODEL_SIZE=small,MGVAOVAO_COLLECTION_URL=${_COLLECTION_URL},QUOTA_SESSIONS_PAR_IP=${_QUOTA_SESSIONS_PAR_IP},QUOTA_RAFALE=${_QUOTA_RAFALE},QUOTA_RAFALE_FENETRE_S=${_QUOTA_RAFALE_FENETRE_S},QUOTA_DUREE_SESSION_S=${_QUOTA_DUREE_SESSION_S},QUOTA_SILENCE_S=${_QUOTA_SILENCE_S},QUOTA_BUDGET_IP_S=${_QUOTA_BUDGET_IP_S},QUOTA_BUDGET_GLOBAL_S=${_QUOTA_BUDGET_GLOBAL_S},QUOTA_REST=${_QUOTA_REST},QUOTA_REST_FENETRE_S=${_QUOTA_REST_FENETRE_S}
      - --allow-unauthenticated
      - --quiet

  # ── Job d'affinage, meme image ─────────────────────────────────────────────
  #
  # Un seul job sert toutes les declinaisons : chaque lancement lui passe ses
  # variables. En creer un par declinaison en produirait des milliers.
  #
  # Un job detruit son instance quand la tache se termine : il n'y a rien a
  # eteindre, donc rien qui puisse rester allume par oubli. C'est la raison du
  # choix, devant une VM moins chere a l'heure mais facturee tant qu'on ne l'a
  # pas supprimee.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: finetune-job
    entrypoint: "bash"
    waitFor: [push-sha]
    args:
      - "-c"
      - |
        # Cloud Run plafonne la duree d'une tache a 3600 s DES QU'UN GPU est
        # demande : demander davantage fait echouer le deploiement du job,
        # avec « must be between 0 and 3600 seconds when using GPU ».
        # C'est donc aussi la borne dure qui tue un entrainement qui derape.
        gcloud run jobs deploy ${_FINETUNE_JOB} \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:${_TAG} \
          --region=${_REGION} --project=$PROJECT_ID \
          --gpu=1 --gpu-type=nvidia-l4 --no-gpu-zonal-redundancy \
          --cpu=8 --memory=32Gi \
          --task-timeout=3600s --max-retries=0 --parallelism=1 \
          --command="python" \
          --args="training/finetune_variant.py" \
          --set-env-vars="MGVAOVAO_DEVICE=cuda,FINETUNE_MIN_LIGNES=${_FINETUNE_MIN_LIGNES}" \
          --quiet

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:${_TAG}
  - us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:latest

# Default machine = n1-highcpu-1 → 120 free build-minutes/day.
# No machineType override here — keep it free-tier eligible.
# (First build will be slow; all subsequent builds hit the Docker layer cache
#  and only rebuild the src/api COPY layers → ~5-10 min, well within free tier.)
timeout: 3600s

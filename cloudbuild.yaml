# MGVaovao — Google Cloud Build pipeline
#
# Builds the CUDA image (Dockerfile.cuda) and pushes to Artifact Registry.
# Use this for Vertex AI training jobs and Cloud Run GPU inference — never
# build the CUDA image locally (3.75 GB layer extraction on WSL2 = 2 hours).
#
# Trigger manually:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _REGION=europe-west1,_REPO=mgvaovao
#
# Or wire to a Cloud Build trigger on push to main.
#
# Required substitutions (set in trigger or --substitutions flag):
#   _REGION   — Artifact Registry region, e.g. europe-west1
#   _REPO     — AR repository name, e.g. mgvaovao
#
# Image tags produced:
#   ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest
#   ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA

substitutions:
  _REGION: europe-west1
  _REPO: mgvaovao

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:

  # ── 1. Build CUDA image ───────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-cuda
    args:
      - build
      - --file=Dockerfile.cuda
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest
      - .

  # ── 2. Push both tags ─────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-sha
    waitFor: [build-cuda]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    waitFor: [build-cuda]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest

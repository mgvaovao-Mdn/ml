# MGVaovao — Google Cloud Build pipeline
#
# Two images are built:
#   1. cuda-training  (Dockerfile.cuda)     — Vertex AI training jobs
#   2. inference      (Dockerfile.cloudrun) — Cloud Run GPU inference (NVIDIA L4)
#                                            Models are baked in at build time.
#
# Trigger manually:
#   gcloud builds submit --config=cloudbuild.yaml --project=mgvaovao-ia .
#
# One-time setup (run before first build):
#   gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com --project=mgvaovao-ia
#   gcloud artifacts repositories create mgvaovao --repository-format=docker --location=us-central1 --project=mgvaovao-ia
#   PROJECT_NUMBER=$(gcloud projects describe mgvaovao-ia --format='value(projectNumber)')
#   gcloud projects add-iam-policy-binding mgvaovao-ia \
#     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/run.admin"
#   gcloud projects add-iam-policy-binding mgvaovao-ia \
#     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/iam.serviceAccountUser"
#
# Image tags produced:
#   us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/mgvaovao:cuda-latest
#   us-central1-docker.pkg.dev/$PROJECT_ID/mgvaovao/inference:latest

substitutions:
  _REGION: us-central1
  _REPO: mgvaovao
  _SERVICE: mgvaovao-inference

options:
  machineType: E2_HIGHCPU_32   # faster downloads during inference build (~8 GB)
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

steps:

  # ── 1a. Build CUDA training image ─────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-cuda
    args:
      - build
      - --file=Dockerfile.cuda
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest
      - .
    timeout: 1800s

  # ── 1b. Build Cloud Run inference image (with baked-in models) ────────────
  - name: gcr.io/cloud-builders/docker
    id: build-inference
    args:
      - build
      - --file=Dockerfile.cloudrun
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:latest
      - .
    timeout: 3000s

  # ── 2a. Push training image ───────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-cuda-sha
    waitFor: [build-cuda]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    id: push-cuda-latest
    waitFor: [build-cuda]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest"]

  # ── 2b. Push inference image ──────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-inference-sha
    waitFor: [build-inference]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    id: push-inference-latest
    waitFor: [build-inference]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:latest"]

  # ── 3. Deploy inference image to Cloud Run (NVIDIA L4 GPU) ────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloudrun
    entrypoint: gcloud
    waitFor: [push-inference-sha]
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:$SHORT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --platform=managed
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --cpu=8
      - --memory=32Gi
      - --no-cpu-throttling
      - --concurrency=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=300
      - --port=8080
      - --set-env-vars=MGVAOVAO_DEVICE=cuda,MGVAOVAO_WHISPER_MODEL_SIZE=small
      - --allow-unauthenticated
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mgvaovao:cuda-latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/inference:latest

timeout: 3600s
